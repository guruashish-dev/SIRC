version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: sirc_redis
    restart: always

  backend:
    build: .
    container_name: sirc_backend
    ports:
      - "${SIRC_PORT:-8002}:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
